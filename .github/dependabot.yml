version: 2
updates:
  # Version updates are off (limit 0). Nothing installs requirements.txt —
  # tests.yml and update_feed.yml both `pip install -r requirements.lock`, and
  # the lock is compiled by hand with `uv pip compile`. Dependabot only bumps
  # the `>=` floor in requirements.txt and never recompiles the lock, so every
  # such PR is either a no-op or drift; see tests/test_requirements_consistency.py,
  # which now fails the build on exactly that (PRs #14, #16, #21, #22).
  # Refresh deliberately instead:
  #   uv pip compile requirements.txt -o requirements.lock
  # Security updates are NOT subject to open-pull-requests-limit and still arrive.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
