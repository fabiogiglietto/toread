name: Pipeline health

# Freshness dead-man's switch for both pipeline chains — see PIPELINE.md and
# scripts/pipeline_health.py. Catches silent staleness that per-run failure
# alerts cannot (dropped dispatches, disabled crons, continue-on-error legs).
#
# Three independent signals per repo: the age of the producing workflow's last
# successful *scheduled* run (disabled or failing cron), the age of its last
# output commit (a stage that runs but quietly no-ops), and the newest runs
# themselves (a step that hangs until the runner kills it, which leaves both
# of the other signals green for days). Output thresholds are deliberately
# slack — these pipelines commit only when there is new input, so a few quiet
# days is the normal duty cycle, not a fault.
#
# Alerts go to the channel named by the OPS_SLACK_CHANNEL repo variable. Leave
# it unset and they fall back into #toread, which is a content channel — set
# the variable, and invite the bot to the channel it names.
#
# Optional secret HEALTHCHECK_PING_URL (e.g. a healthchecks.io check) closes
# the who-watches-the-watcher loop: if this workflow itself stops running,
# the external service alerts.

on:
  schedule:
    - cron: '30 7 * * *'   # daily, after the 05:00-07:00 UTC pipeline crons
  workflow_dispatch:
    inputs:
      max_age_override_days:
        description: "Override every staleness threshold (set 0 to test alerting)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # the cron probe reads workflow-run history
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Carries yesterday's findings forward so a finding must recur before it
      # alerts (see hold_until_confirmed). Key rotates per run because cache
      # entries are immutable; restore-keys picks up the newest previous one.
      # A miss is safe: the check then posts unconfirmed rather than staying
      # quiet.
      - name: Restore previous findings
        uses: actions/cache@v4
        with:
          path: .health-state
          key: pipeline-health-state-${{ github.run_id }}
          restore-keys: pipeline-health-state-

      - name: Check pipeline freshness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.OPS_SLACK_CHANNEL || secrets.SLACK_TOREAD_CHANNEL_ID }}
          MAX_AGE_OVERRIDE_DAYS: ${{ inputs.max_age_override_days }}
          HEALTH_STATE_FILE: .health-state/pipeline_health.json
        run: python scripts/pipeline_health.py

      - name: Ping healthcheck (watch the watcher)
        if: success()
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -n "$HEALTHCHECK_PING_URL" ]; then
            curl -sf -m 10 --retry 3 "$HEALTHCHECK_PING_URL" > /dev/null || true
          else
            echo "HEALTHCHECK_PING_URL not set — skipping"
          fi
