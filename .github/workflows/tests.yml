name: Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schema/**'
      - 'requirements*'
      - '.github/workflows/tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schema/**'
      - 'requirements*'
  workflow_dispatch:
  # Entry point for dependabot-automerge.yml. Unlike the `pull_request`
  # trigger above it has no `paths:` filter, so github-actions bumps —
  # which touch none of those paths — still get a test signal.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.lock pytest

      - name: Run tests
        run: pytest tests/ -q

      - name: Validate current feed against schema
        run: check-jsonschema --schemafile schema/feed.schema.json output/feed.json
